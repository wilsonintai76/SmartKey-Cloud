# Key Cabinet WebAuthn Backend
# Cloudflare Worker (Hono) with D1 + KV
# Deploy: npx wrangler deploy

name = "smartkey"
main = "src/index.ts"
compatibility_date = "2025-07-21"
account_id = "b6f9b4c33511b3e607595a0993dfdcd4"

[[d1_databases]]
binding = "DB"
database_name = "smartkey-db"
database_id = "f5ad0733-ce5b-49c5-aed6-5afae9dd8d0c"

[[kv_namespaces]]
binding = "KV"
id = "999ef8b6bb814df0ba18e2860312e9c8"

[vars]
RP_ID = "localhost"
RP_NAME = "Key Cabinet"
ORIGIN = "http://localhost:3000"

# GENERATE THIS before production deploy:
#   node -e "console.log(crypto.randomBytes(32).toString('base64url'))"
# Then set it via: npx wrangler secret put JWT_SECRET
# For dev: omit JWT_SECRET (falls back to dev default in code)

[dev]
port = 8787

# ── Production overrides ───────────────────────────────────────────
[env.production]
vars = { RP_ID = "smartkey-7ak.pages.dev", RP_NAME = "Key Cabinet" }

[[env.production.d1_databases]]
binding = "DB"
database_name = "smartkey-db"
database_id = "f5ad0733-ce5b-49c5-aed6-5afae9dd8d0c"

[[env.production.kv_namespaces]]
binding = "KV"
id = "999ef8b6bb814df0ba18e2860312e9c8"
