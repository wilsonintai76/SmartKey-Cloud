# Key Cabinet WebAuthn Backend
# Cloudflare Worker (Hono) with D1 + KV
# Deploy: npx wrangler deploy

name = "smartkey"
main = "src/index.ts"
compatibility_date = "2025-07-21"
account_id = "31318c7c7baa536e7653d8037816cda0"

[[d1_databases]]
binding = "DB"
database_name = "key-cabinet-db"
database_id = "68c5688d-f077-4d90-abe8-bb8720a2bdae"

[[kv_namespaces]]
binding = "KV"
id = "7782c294799449868bfa8f96abf47f73"

[vars]
RP_ID = "localhost"
RP_NAME = "Key Cabinet"
ORIGIN = "http://localhost:3000"

# GENERATE THIS before production deploy:
#   node -e "console.log(crypto.randomBytes(32).toString('base64url'))"
# Then set it via: npx wrangler secret put JWT_SECRET
# For dev: omit JWT_SECRET (falls back to dev default in code)

[dev]
port = 8787

# ── Production overrides ───────────────────────────────────────────
[env.production]
vars = { RP_ID = "smartkey.pages.dev", RP_NAME = "Key Cabinet", ORIGIN = "https://smartkey.pages.dev" }

[[env.production.d1_databases]]
binding = "DB"
database_name = "key-cabinet-db"
database_id = "68c5688d-f077-4d90-abe8-bb8720a2bdae"

[[env.production.kv_namespaces]]
binding = "KV"
id = "7782c294799449868bfa8f96abf47f73"
